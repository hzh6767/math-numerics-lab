name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The modules use np.fft and mpmath only; test across the two supported
        # lines so a change that depends on a newer numpy is caught here.
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite pins published reference values (zeta zeros, Goldbach
      # partition counts, Collatz stopping times, N-S convergence orders), so a
      # green run means those constants still reproduce on this interpreter.
      - name: Run tests
        run: python -m pytest tests -q

      # The modules must also run standalone, not only under pytest.
      - name: Run each module
        run: |
          python zeta_zeros.py
          python goldbach.py
          python collatz.py
          python ns2d_convergence.py
        env:
          MPLBACKEND: Agg
